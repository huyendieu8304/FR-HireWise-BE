# ================== PROFILE: local ==================
#---
spring.config.activate.on-profile=local
spring.config.import=optional:file:.env.local[.properties]

# DB dev (Supabase) dung chung cho ca team qua nhieu nhanh git khac nhau - 1 migration
# co the da duoc 1 nhanh khac ap dung truc tiep len DB nay truoc khi merge/push, nen
# flyway_schema_history co the chua 1 version khong ton tai trong migration folder cua
# nhanh dang checkout ("Detected applied migration not resolved locally"). Chi bo qua
# viec validate nhung migration KHONG resolve duoc cuc bo (vd future/missing) - khong
# anh huong gi den schema/du lieu that, chi noi long kiem tra o may local.
spring.flyway.ignore-migration-patterns=*:missing,*:future
