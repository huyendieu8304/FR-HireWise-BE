spring.application.name=HireWise-BE

# Profile mac dinh = local
#   SPRING_PROFILES_ACTIVE=dev   hoac   SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=local

# ================== DATABASE ==================
# --- Database (Supabase Postgres, schema "public" - business AND auth data)
# Session pooler (port 5432) cua Supabase.
# Hibernate/Flyway need prepared statement + advisory lock
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Database Migration (Flyway) - schema "public"
spring.flyway.enabled=true

# ================== ERROR MESSAGE ==================
# --- i18n cho message loi (xem messages.properties)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ================== AUTH (Spring Security) ==================
app.jwt.secret=${JWT_SECRET:}
# TTL access token 8 hour
app.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:28800}
# lock acount after 5 fail login attempt, lock in 15 minute
app.auth.lockout-max-attempts=${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
app.auth.lockout-window-minutes=${AUTH_LOCKOUT_WINDOW_MINUTES:15}
app.auth.lockout-duration-minutes=${AUTH_LOCKOUT_DURATION_MINUTES:15}
# TTL refresh token 7 days
app.auth.refresh-token-ttl-days=${AUTH_REFRESH_TOKEN_TTL_DAYS:7}

# --- Rate limit by IP cho /api/auth/login va /api/auth/google, prevent brute force
app.auth.ip-rate-limit-max-attempts=${AUTH_IP_RATE_LIMIT_MAX_ATTEMPTS:20}
app.auth.ip-rate-limit-window-minutes=${AUTH_IP_RATE_LIMIT_WINDOW_MINUTES:15}

# Google Identity Services
# empty = turn Google SSO off.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# for create activation link for newly created account
app.activation.token-ttl-hours=${ACTIVATION_TOKEN_TTL_HOURS:72}
app.activation.link-base-url=${ACTIVATION_LINK_BASE_URL:http://localhost:3000/activate}

# --- Bootstrap HR_ADMIN account (config.BootstrapAdminInitializer).
# only work when both email and password is not empty and no user exist with the email
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-full-name=${BOOTSTRAP_ADMIN_FULL_NAME:Bootstrap HR Admin}

# ================== EMAIL ==================
# --- SMTP
# Local dev: MailHog (docker/docker-compose.yml) view email sent without real SMTP.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

app.mail.from=${MAIL_FROM:no-reply@hirewise.local}
app.mail.product-name=${MAIL_PRODUCT_NAME:HireWise}

# --- Transactional outbox poller (service.OutboxDispatcher)
app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:5000}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:20}
app.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:5}

# ================== RBAC ==================
# TTL cache users.status
app.rbac.user-status-cache-ttl-seconds=${RBAC_USER_STATUS_CACHE_TTL_SECONDS:45}
# TTL cache active session
app.rbac.session-cache-ttl-seconds=${RBAC_SESSION_CACHE_TTL_SECONDS:20}
# TTL cache active roles of user
app.rbac.user-roles-cache-ttl-seconds=${RBAC_USER_ROLES_CACHE_TTL_SECONDS:30}
# TTL cache role-permission matrix - stable more than account so longer time
app.rbac.role-permission-cache-ttl-seconds=${RBAC_ROLE_PERMISSION_CACHE_TTL_SECONDS:300}

# ================== OBSERVABILITY ==================
# metric, health...
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${spring.profiles.active}

# Logs
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hirewise.be=${LOG_LEVEL_APP:DEBUG}