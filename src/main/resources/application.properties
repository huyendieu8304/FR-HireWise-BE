# ============================================================
# Cau hinh chung, dung chung cho ca 3 profile (local/dev/prod).
# Gia tri nhay cam/dong theo moi truong duoc tham chieu qua ${...} va
# nap tu file .env tuong ung (xem cac khoi "PROFILE" o cuoi file).
# Hanh vi rieng, sau cua tung profile (bat/tat feature...) nam trong
# application-{profile}.properties (hien tai chi co application-prod.properties).
# ============================================================
spring.application.name=HireWise-BE

# Profile mac dinh = local
#   SPRING_PROFILES_ACTIVE=dev   hoac   SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=local

# ================== COMMON ==================

# --- Database (Supabase Postgres, schema "public" - business data) ---
# Dung Session pooler hoac Direct connection (port 5432) cua Supabase.
# TRANH Transaction pooler (thuong port 6543): Hibernate/Flyway can
# prepared statement + advisory lock, khong hoat dong dung voi transaction pooling mode.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Database Migration (Flyway) - schema "public"
spring.flyway.enabled=true

# --- i18n cho message loi (xem messages.properties) ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- Keycloak / OAuth2 Resource Server ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
app.keycloak.resource-client-id=${KEYCLOAK_RESOURCE_CLIENT_ID:hirewise-be}

# ================== OBSERVABILITY ==================
# Metrics: Prometheus SCRAPE endpoint /actuator/prometheus (pull model -
# Prometheus server tu vao lay, app khong can biet dia chi Prometheus).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${spring.profiles.active}

# Logs: xem logback-spring.xml - local in dang text de doc, dev/prod in
# JSON ra stdout de log shipper (Promtail/Grafana Alloy/Fluent Bit) doc
# va day vao Loki. correlationId/userId/userRoles/traceId/spanId duoc tu
# dong gan vao MDC cho moi request (xem package logging, security).
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hirewise.be=${LOG_LEVEL_APP:DEBUG}