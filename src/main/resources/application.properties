# ============================================================
# Cau hinh chung, dung chung cho ca 3 profile (local/dev/prod).
# Gia tri nhay cam/dong theo moi truong duoc tham chieu qua ${...} va
# nap tu file .env tuong ung (xem cac khoi "PROFILE" o cuoi file).
# Hanh vi rieng, sau cua tung profile (bat/tat feature...) nam trong
# application-{profile}.properties (hien tai chi co application-prod.properties).
# ============================================================
spring.application.name=HireWise-BE

# Profile mac dinh = local
#   SPRING_PROFILES_ACTIVE=dev   hoac   SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=local

# ================== DATABASE ==================
# --- Database (Supabase Postgres, schema "public" - business data)
# Session pooler (port 5432) cua Supabase.
# Hibernate/Flyway need prepared statement + advisory lock
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Database Migration (Flyway) - schema "public"
spring.flyway.enabled=true

# ================== ERROR MESSAGE ==================
# --- i18n cho message loi (xem messages.properties)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ================== OAuth2 and RBAC ==================
# --- Keycloak / OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
app.keycloak.resource-client-id=${KEYCLOAK_RESOURCE_CLIENT_ID:hirewise-be}

# --- RBAC (xem package authorization, security.UserDirectoryService)
# TTL cache users.status
app.rbac.user-status-cache-ttl-seconds=${RBAC_USER_STATUS_CACHE_TTL_SECONDS:45}
# TTL cache role-permission matrix - stable more than account so longer time
app.rbac.role-permission-cache-ttl-seconds=${RBAC_ROLE_PERMISSION_CACHE_TTL_SECONDS:300}
# ================== OBSERVABILITY ==================
# metric, health...
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${spring.profiles.active}

# Logs
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hirewise.be=${LOG_LEVEL_APP:DEBUG}