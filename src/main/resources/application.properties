spring.application.name=HireWise-BE

# Profile mac dinh = local
#   SPRING_PROFILES_ACTIVE=dev   hoac   SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=local

# ================== DATABASE ==================
# --- Database (Supabase Postgres, schema "public" - business AND auth data)
# Session pooler (port 5432) cua Supabase.
# Hibernate/Flyway need prepared statement + advisory lock
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}

# --- JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Database Migration (Flyway) - schema "public"
spring.flyway.enabled=true

# ================== ERROR MESSAGE ==================
# --- i18n cho message loi (xem messages.properties)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ================== AUTH (Spring Security) ==================
app.jwt.secret=${JWT_SECRET:}
# TTL access token 8 hour
app.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:28800}
# lock acount after 5 fail login attempt, lock in 15 minute
app.auth.lockout-max-attempts=${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
app.auth.lockout-window-minutes=${AUTH_LOCKOUT_WINDOW_MINUTES:15}
app.auth.lockout-duration-minutes=${AUTH_LOCKOUT_DURATION_MINUTES:15}
# TTL refresh token 7 days
app.auth.refresh-token-ttl-days=${AUTH_REFRESH_TOKEN_TTL_DAYS:7}

# --- Rate limit by IP cho /api/auth/login va /api/auth/google, prevent brute force
app.auth.ip-rate-limit-max-attempts=${AUTH_IP_RATE_LIMIT_MAX_ATTEMPTS:20}
app.auth.ip-rate-limit-window-minutes=${AUTH_IP_RATE_LIMIT_WINDOW_MINUTES:15}

# Google Identity Services
# empty = turn Google SSO off.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ================== CORS ==================
# Comma-separated origins allowed to call this API from a browser (the
# React frontend). Vite's default dev port is 5173.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# for create activation link for newly created account
app.activation.token-ttl-hours=${ACTIVATION_TOKEN_TTL_HOURS:72}
app.activation.link-base-url=${ACTIVATION_LINK_BASE_URL:http://localhost:3000/activate}

# --- Bootstrap HR_ADMIN account (config.BootstrapAdminInitializer).
# only work when both email and password is not empty and no user exist with the email
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-full-name=${BOOTSTRAP_ADMIN_FULL_NAME:Bootstrap HR Admin}

# ================== EMAIL ==================
# --- SMTP
# Local dev: MailHog (docker/docker-compose.yml) view email sent without real SMTP.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

app.mail.from=${MAIL_FROM:no-reply@hirewise.local}
app.mail.product-name=${MAIL_PRODUCT_NAME:HireWise}

# --- Transactional outbox poller (service.OutboxDispatcher)
app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:5000}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:20}
app.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:5}

# ================== RBAC ==================
# TTL cache users.status
app.rbac.user-status-cache-ttl-seconds=${RBAC_USER_STATUS_CACHE_TTL_SECONDS:45}
# TTL cache active session
app.rbac.session-cache-ttl-seconds=${RBAC_SESSION_CACHE_TTL_SECONDS:20}
# TTL cache active roles of user
app.rbac.user-roles-cache-ttl-seconds=${RBAC_USER_ROLES_CACHE_TTL_SECONDS:30}
# TTL cache role-permission matrix - stable more than account so longer time
app.rbac.role-permission-cache-ttl-seconds=${RBAC_ROLE_PERMISSION_CACHE_TTL_SECONDS:300}

# ================== OBSERVABILITY ==================
# metric, health...
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${spring.profiles.active}

# Logs
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hirewise.be=${LOG_LEVEL_APP:DEBUG}

# ================== CLOUD STORAGE OAUTH (UC-07/UC-08) ==================
# empty client-id/secret = provider left unconfigured; /connect fails
# gracefully (ME-16) instead of the app failing to boot.
app.integration.google-drive.client-id=${GOOGLE_DRIVE_CLIENT_ID:}
app.integration.google-drive.client-secret=${GOOGLE_DRIVE_CLIENT_SECRET:}
app.integration.google-drive.redirect-uri=${GOOGLE_DRIVE_REDIRECT_URI:http://localhost:8080/api/integrations/cloud-storage/google-drive/callback}

app.integration.dropbox.client-id=${DROPBOX_CLIENT_ID:}
app.integration.dropbox.client-secret=${DROPBOX_CLIENT_SECRET:}
app.integration.dropbox.redirect-uri=${DROPBOX_REDIRECT_URI:http://localhost:8080/api/integrations/cloud-storage/dropbox/callback}

# AES-256 key (base64, must decode to 32 bytes) used to encrypt
# oauth_tokens at rest. Blank = a random per-boot key (dev only - see
# integration.TokenCipher); every other profile MUST set this explicitly.
app.integration.token-encryption-key=${INTEGRATION_TOKEN_ENCRYPTION_KEY:}

# Where the HR Admin's browser lands after a Connect/Reconnect attempt
# finishes, success or failure (?provider=...&connected=true|false).
app.integration.frontend-redirect-url=${INTEGRATION_FRONTEND_REDIRECT_URL:http://localhost:5173/settings/integrations}

# --- Background worker (service.CloudStorageTokenRefreshWorker) - ERD 05
# How often the worker polls for a connection close to expiring.
app.integration.token-refresh-poll-interval-ms=${INTEGRATION_TOKEN_REFRESH_POLL_INTERVAL_MS:300000}
# How many minutes before the stored token_expires_at the worker tries to refresh.
app.integration.token-refresh-before-expiry-minutes=${INTEGRATION_TOKEN_REFRESH_BEFORE_EXPIRY_MINUTES:15}

# --- Background worker (service.CalendarTokenRefreshWorker)
# How often the worker polls for an expiring Calendar token (default: 5 min = 300000ms).
app.integration.calendar-token-refresh-poll-interval-ms=${CALENDAR_TOKEN_REFRESH_POLL_INTERVAL_MS:300000}
# How many minutes before token_expires_at the Calendar worker tries to refresh (default: 15 min).
# Must be > poll-interval to guarantee at least one attempt before the token actually expires.
app.integration.calendar-token-refresh-before-expiry-minutes=${CALENDAR_TOKEN_REFRESH_BEFORE_EXPIRY_MINUTES:15}

# file upload size
spring.servlet.multipart.max-file-size=${CV_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${CV_MAX_REQUEST_SIZE:12MB}

# where a CV is held when Cloud Storage is EXPIRED/REVOKED (or an upload attempt otherwise fails) - see service.FileStorageService.
app.file-storage.pending-upload-dir=${FILE_STORAGE_PENDING_UPLOAD_DIR:./data/pending-cv-uploads}

# ================== AI MATCH ANALYSIS (UC-21) ==================
# "anthropic" (default) = calls the real Claude API, costs real API credit
# (separate billing from any Claude Pro/Max subscription - that does NOT
# cover API usage). "mock" = ai.MockMatchingEngine, zero cost, instant fake
# result - for exercising the full UC-21 flow (Badge/tab/DB) during local
# dev without needing real Anthropic credit at all.
app.ai.engine=${HIREWISE_AI_ENGINE:anthropic}
# HireWise's OWN Anthropic account key - empty = AI Screening always FAILs
# gracefully per-run (EX-01), the app itself still boots and works normally.
# Not read at all when app.ai.engine=mock.
app.ai.anthropic.api-key=${HIREWISE_ANTHROPIC_API_KEY:}
app.ai.anthropic.model=${HIREWISE_ANTHROPIC_MODEL:claude-haiku-4-5}
# --- AiScreeningDispatcher poller (event.AiScreeningDispatcher, same shape as service.OutboxDispatcher)
app.ai.poll-interval-ms=${AI_SCREENING_POLL_INTERVAL_MS:5000}
app.ai.batch-size=${AI_SCREENING_BATCH_SIZE:10}

# ================== CALENDAR OAUTH (UC-18) ==================
# Client credentials registered on Google Cloud Console / Azure App Registrations.
# Blank = provider left unconfigured; /connect fails gracefully.
app.integration.google-calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
app.integration.google-calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
app.integration.google-calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/integrations/calendar/google-calendar/callback}

app.integration.outlook-calendar.client-id=${OUTLOOK_CALENDAR_CLIENT_ID:}
app.integration.outlook-calendar.client-secret=${OUTLOOK_CALENDAR_CLIENT_SECRET:}
app.integration.outlook-calendar.redirect-uri=${OUTLOOK_CALENDAR_REDIRECT_URI:http://localhost:8080/api/integrations/calendar/outlook-calendar/callback}

# Where the HR Admin's browser lands after a Calendar Connect attempt finishes.
app.integration.calendar-frontend-redirect-url=${CALENDAR_FRONTEND_REDIRECT_URL:http://localhost:5173/settings/integrations/calendar}

# ================== AI MATCH ANALYSIS (UC-21) ==================
# "anthropic" (default) = calls the real Claude API, costs real API credit
# (separate billing from any Claude Pro/Max subscription - that does NOT
# cover API usage). "mock" = ai.MockMatchingEngine, zero cost, instant fake
# result - for exercising the full UC-21 flow (Badge/tab/DB) during local
# dev without needing real Anthropic credit at all.
app.ai.engine=${HIREWISE_AI_ENGINE:anthropic}
# HireWise's OWN Anthropic account key - empty = AI Screening always FAILs
# gracefully per-run (EX-01), the app itself still boots and works normally.
# Not read at all when app.ai.engine=mock.
app.ai.anthropic.api-key=${HIREWISE_ANTHROPIC_API_KEY:}
app.ai.anthropic.model=${HIREWISE_ANTHROPIC_MODEL:claude-haiku-4-5}
# --- AiScreeningDispatcher poller (event.AiScreeningDispatcher, same shape as service.OutboxDispatcher)
app.ai.poll-interval-ms=${AI_SCREENING_POLL_INTERVAL_MS:5000}
app.ai.batch-size=${AI_SCREENING_BATCH_SIZE:10}

# ================== CALENDAR OAUTH (UC-18) ==================
# Client credentials registered on Google Cloud Console / Azure App Registrations.
# Blank = provider left unconfigured; /connect fails gracefully.
app.integration.google-calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
app.integration.google-calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
app.integration.google-calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/integrations/calendar/google-calendar/callback}

app.integration.outlook-calendar.client-id=${OUTLOOK_CALENDAR_CLIENT_ID:}
app.integration.outlook-calendar.client-secret=${OUTLOOK_CALENDAR_CLIENT_SECRET:}
app.integration.outlook-calendar.redirect-uri=${OUTLOOK_CALENDAR_REDIRECT_URI:http://localhost:8080/api/integrations/calendar/outlook-calendar/callback}

# Where the HR Admin's browser lands after a Calendar Connect attempt finishes.
app.integration.calendar-frontend-redirect-url=${CALENDAR_FRONTEND_REDIRECT_URL:http://localhost:5173/settings/integrations/calendar}

# ================== UC-38 UC-39 (Offer & e-Signature) ==================
# Base URL of the candidate-facing Offer page; the raw link token is appended
# as a path segment (see service.OfferSendService).
app.offer.link-base-url=${OFFER_LINK_BASE_URL:http://localhost:5173/offer}
# BR-OFFER-03: OTP lifetime, wrong-code budget and resend throttle for UC-38.
app.offer.otp-ttl-minutes=${OFFER_OTP_TTL_MINUTES:5}
app.offer.otp-max-attempts=${OFFER_OTP_MAX_ATTEMPTS:5}
app.offer.otp-resend-limit=${OFFER_OTP_RESEND_LIMIT:3}
# How long one successful OTP verification keeps the offer readable/signable.
app.offer.view-window-minutes=${OFFER_VIEW_WINDOW_MINUTES:30}
# BR-OFFER-02: how often OfferExpiryWorker sweeps for overdue Offers.
app.offer.expiry-poll-interval-ms=${OFFER_EXPIRY_POLL_INTERVAL_MS:300000}
